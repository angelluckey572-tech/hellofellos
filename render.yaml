# Free instances sleep after 15 idle minutes. An external cron
# (cron-job.org) can hit https://<service>.onrender.com/ every 30 minutes
# to keep it warm, but it is optional.
services:
  - type: web
    name: floodnet
    runtime: python
    plan: free
    buildCommand: "true"
    startCommand: "python3 fold.py agent"
    envVars:
      - key: TOKEN
        sync: false
      - key: PROCS
        value: "2"
      - key: THREADS
        value: "32"
